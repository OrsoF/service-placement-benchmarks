name: tests

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the minimum supported Python and mypy target so dependency
          # stubs are compatible with the version being checked.
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests examples
      - run: python -m ruff format --check src tests examples
      - run: python -m mypy

  base-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python -I -m service_placement --help
      - run: python examples/quickstart.py
      - run: service-placement --seed 42 --start-users 2 --stop-users 3

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
        profile: [minimal, extras]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: matrix.profile == 'minimal'
        run: python -m pip install -e ".[test]"
      - if: matrix.profile == 'extras'
        run: python -m pip install -e ".[benchmarks,exact,environments,evolutionary,test]"
      - if: matrix.profile == 'minimal'
        run: python -m pytest
      - if: matrix.profile == 'extras'
        run: python -m pytest -m "not rl" --require-extras
      - run: python -m build
      - run: service-placement --help
      - run: service-placement --instance tree --solvers fast_heuristic --start-users 2 --stop-users 3 --neighbors 0 --no-plots
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.profile == 'extras'
        with:
          name: distributions
          path: dist/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t service-placement .
      - run: docker run --rm service-placement --help
      - run: docker run --rm service-placement --instance tree --solvers fast_heuristic --start-users 2 --stop-users 3 --neighbors 0 --no-plots

  optional-rl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[benchmarks,exact,evolutionary,rl,test]"
      - run: python -m pytest --require-extras
