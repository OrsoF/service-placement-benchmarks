[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "service-placement-benchmarks"
version = "0.1.0"
description = "Service placement benchmarks for mobile edge computing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "networkx>=2.8"]

[project.optional-dependencies]
benchmarks = ["pandas>=1.5", "matplotlib>=3.6", "tqdm>=4.64"]
exact = ["pyomo>=6.7"]
gurobi = ["gurobipy>=10"]
evolutionary = ["cma>=3.3", "tqdm>=4.64"]
environments = ["gymnasium>=0.29", "matplotlib>=3.6"]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.2", "torch>=2", "matplotlib>=3.6"]
test = ["pytest>=7", "build>=1"]
dev = ["pytest>=7", "build>=1", "ruff==0.12.0", "mypy==1.17.1"]

[project.scripts]
service-placement = "service_placement.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["service_placement*"]

[tool.setuptools.package-data]
service_placement = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--import-mode=importlib --strict-markers"
markers = ["requires(*modules): optional dependencies required by a test", "rl: requires the reinforcement learning extra"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = [
  "src/service_placement/api.py", "src/service_placement/errors.py",
  "src/service_placement/domain/contracts.py", "src/service_placement/domain/solution.py", "src/service_placement/domain/validation.py", "src/service_placement/domain/loads.py",
  "src/service_placement/domain/problem_arrays.py",
  "src/service_placement/domain/conversions.py",
  "src/service_placement/utils/solver_base.py", "src/service_placement/utils/solver_registry.py",
  "src/service_placement/utils/ilp_solvers.py", "src/service_placement/utils/heuristic_solvers.py",
  "src/service_placement/compat/problem_state.py",
]
follow_imports = "silent"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["networkx"]
ignore_missing_imports = true
